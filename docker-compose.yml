name: portfolio-sample-api

services:
  flask-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-api-sample:1.0
    ports:
      - "5000:5000"
    volumes:
      - .:/api
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
    networks:
      - portfolio-api-net

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - portfolio-api-net

networks:
  portfolio-api-net:
    driver: bridge

volumes:
  redis-data: