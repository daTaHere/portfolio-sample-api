name: portfolio-sample-api

services:
  flask-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-api-sample:1.0
    # Inject environment variables from .env file
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - .:/api
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
    networks:
      - portfolio-api-net

  redis:
    image: redis:8
    # Mapping port for development debugging purposes only
    ports:
      - "6379:6379" # Remove port mapping in production for better security
    volumes:
      - redis-data:/data
    networks:
      - portfolio-api-net

networks:
  portfolio-api-net:
    driver: bridge

volumes:
  redis-data:
